<ossec_config>
  <!-- Central SIEM Management Server Connection -->
  <client>
    <server>
      <address>192.168.1.14</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows</config-profile>
  </client>

  <!-- Core Windows Event Log Channels To Monitor -->
  <localfile>
    <location>Application</location>
    <log_format>eventlog</log_format>
  </localfile>

  <localfile>
    <location>Security</location>
    <log_format>eventlog</log_format>
  </localfile>

  <localfile>
    <location>System</location>
    <log_format>eventlog</log_format>
  </localfile>

  <!-- Advanced Network Entry Tracking Channel (Engineered Rule) -->
  <localfile>
    <location>OpenSSH/Operational</location>
    <log_format>eventlog</log_format>
  </localfile>
</ossec_config>
